[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plan-test-project"
version = "0.1.0"
description = "A bootstrapped Python project with best practices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-playwright>=0.7.2",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plan_test_project"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
